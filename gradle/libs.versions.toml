[versions]
agp = "9.2.1"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.2"
hilt = "2.59.1"
lifecycle = "2.8.2"
retrofit = "2.11.0"
okhttp = "4.12.0"
glide = "4.16.0"
room = "2.8.4"
